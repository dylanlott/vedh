server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets with long cache time
  location ~* \/assets\/.*\.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The local Docker frontend and API share an origin. Proxy both GraphQL
  # HTTP requests and graphql-ws upgrades to the Compose service.
  location = /graphql {
    proxy_pass http://server:8080/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # Fallback for SPA routes to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Disable logging of health checks or OPTIONS if desired
  location = /health {
    access_log off;
    return 200 'ok';
  }
}
