name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go unit and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet packages
        run: go vet ./...

      - name: Run unit tests
        run: make test-unit test-persistence

  server:
    name: Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: edhgo
          POSTGRES_PASSWORD: edhgo
          POSTGRES_DB: edhgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edhgo -d edhgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://edhgo:edhgo@127.0.0.1:5432/edhgo?sslmode=disable
      JWT_SECRET: ci-server-test-secret
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run server integration tests
        run: make test-api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Compile production frontend
        run: npm run build

  end-to-end:
    name: Smoke and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: edhgo
          POSTGRES_PASSWORD: edhgo
          POSTGRES_DB: edhgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edhgo -d edhgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://edhgo:edhgo@127.0.0.1:5432/edhgo?sslmode=disable
      JWT_SECRET: ci-e2e-secret
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      VEDH_GRAPHQL_URL: http://127.0.0.1:8080/graphql
      VEDH_APP_BASE_URL: http://127.0.0.1:5173
      CI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-04

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Prepare deterministic test database
        run: go run ./tools/testdb

      - name: Start API and frontend
        run: |
          go run . > "$RUNNER_TEMP/vedh-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vedh-server.pid"
          (cd app && npm run dev -- --host 127.0.0.1 --strictPort) > "$RUNNER_TEMP/vedh-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vedh-web.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/playground >/dev/null \
              && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          printf '%s\n' 'Local application failed to become ready'
          exit 1

      - name: Run Rust API smoke
        run: cargo run --locked --manifest-path tools/smoke/Cargo.toml -- --graphql-url "$VEDH_GRAPHQL_URL"

      - name: Run browser E2E
        working-directory: app
        run: npm run test:e2e

      - name: Stop local application
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/vedh-server.pid" "$RUNNER_TEMP/vedh-web.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/vedh-ci-diagnostics"
          cp "$RUNNER_TEMP/vedh-server.log" "$RUNNER_TEMP/vedh-ci-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/vedh-web.log" "$RUNNER_TEMP/vedh-ci-diagnostics/" 2>/dev/null || true
          cp -R app/test-results "$RUNNER_TEMP/vedh-ci-diagnostics/" 2>/dev/null || true
          cp -R app/playwright-report "$RUNNER_TEMP/vedh-ci-diagnostics/" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/vedh-ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7
