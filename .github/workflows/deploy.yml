name: Deploy to Dokku

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://vedh.xyz
    env:
      DOKKU_HOST: ${{ vars.DOKKU_HOST }}
      DOKKU_API_APP: ${{ vars.DOKKU_API_APP }}
      DOKKU_WEB_APP: ${{ vars.DOKKU_WEB_APP }}
      DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
      DOKKU_KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          test -n "$DOKKU_HOST" || { printf '%s\n' 'DOKKU_HOST is not configured'; exit 1; }
          test -n "$DOKKU_API_APP" || { printf '%s\n' 'DOKKU_API_APP is not configured'; exit 1; }
          test -n "$DOKKU_WEB_APP" || { printf '%s\n' 'DOKKU_WEB_APP is not configured'; exit 1; }
          test -n "$DOKKU_SSH_PRIVATE_KEY" || { printf '%s\n' 'DOKKU_SSH_PRIVATE_KEY is not configured'; exit 1; }
          test -n "$DOKKU_KNOWN_HOSTS" || { printf '%s\n' 'DOKKU_KNOWN_HOSTS is not configured'; exit 1; }

      - name: Configure Dokku SSH access
        run: |
          key_path="$RUNNER_TEMP/dokku_key"
          known_hosts_path="$RUNNER_TEMP/dokku_known_hosts"
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$DOKKU_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          {
            printf 'DOKKU_KEY_PATH=%s\n' "$key_path"
            printf 'DOKKU_KNOWN_HOSTS_PATH=%s\n' "$known_hosts_path"
          } >> "$GITHUB_ENV"

      - name: Deploy API
        run: |
          git remote add dokku-api "dokku@$DOKKU_HOST:$DOKKU_API_APP"
          GIT_SSH_COMMAND="ssh -i $DOKKU_KEY_PATH -o IdentitiesOnly=yes -o UserKnownHostsFile=$DOKKU_KNOWN_HOSTS_PATH -o StrictHostKeyChecking=yes" \
            git push dokku-api HEAD:refs/heads/main

      - name: Deploy frontend
        run: |
          web_revision="$(git subtree split --prefix app HEAD)"
          git remote add dokku-web "dokku@$DOKKU_HOST:$DOKKU_WEB_APP"
          GIT_SSH_COMMAND="ssh -i $DOKKU_KEY_PATH -o IdentitiesOnly=yes -o UserKnownHostsFile=$DOKKU_KNOWN_HOSTS_PATH -o StrictHostKeyChecking=yes" \
            git push dokku-web "$web_revision":refs/heads/main

      - name: Verify production routes
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 5 https://vedh.xyz/ >/dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 5 https://api.vedh.xyz/playground >/dev/null
