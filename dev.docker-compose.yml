services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    links:
      - server:server
    ports:
      - 8080:80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .vedh.env
    ports:
      - 8081:8080
    links:
      - postgres:postgres
    volumes:
      - "./persistence/migrations/:/app/persistence/migrations/"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME:-edhgo}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-edhgo}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:-edhgo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ./.pg.env
    ports:
      - 5432:5432
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres-data:
