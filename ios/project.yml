name: Vedh

options:
  bundleIdPrefix: xyz.vedh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  VedhCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/VedhCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.vedh.core
        SKIP_INSTALL: YES

  Vedh:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: VedhCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: vedh
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        VEDH_GRAPHQL_ENDPOINT: https://api.vedh.xyz/graphql
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.vedh.app
        PRODUCT_NAME: vedh
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  VedhTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VedhCoreTests
    dependencies:
      - target: VedhCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.vedh.tests

schemes:
  Vedh:
    build:
      targets:
        Vedh: all
        VedhTests: [test]
    test:
      targets:
        - VedhTests
      gatherCoverageData: true
