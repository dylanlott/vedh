scalar Time

type Mutation {
  signup(username: String!, password: String!): User!
  login(username: String!, password: String!): User!
  createGame(input: InputCreateGame!): Game!
  joinGame(input: InputJoinGame): Game!
  updateGame(input: InputGame!): Game!
  passPriority(gameID: String!, toPlayer: String!): Game!
  advancePhase(gameID: String!, phase: String!, number: Int): Game!
  updateBoardState(input: InputBoardState!): BoardState!
  claimWin(gameID: String!, condition: String): Game!
  previewDeck(input: InputDeckImport!): DeckPreview!
  trackProductEvent(input: InputProductEvent!): Boolean!
  guestSession(displayName: String, sessionID: String!): User!
  # Silent D-2.3 token re-issue. This is the only mutation to which a
  # browser sends the separate guest bearer credential.
  refreshGuestSession(credential: String!): User!
}

type Query {
  users(userID: String): [String!]!
  games(offset: Int!, limit: Int!): [Game]!
  formats: [GameFormat!]!
  getGame(gameID: String!): Game!
  gameLogs(gameID: String!, offset: Int!, limit: Int!): [GameLogEvent!]!
  card(name: String!, id: String): Card
  cards(list: [String!]): [Card!]!
  search(name: String, colors: [String], colorIdentity: [String], keywords: [String]): [Card]
  searchAll(name: String, colors: [String], colorIdentity: [String], keywords: [String]): [Card]
}

type Subscription {
  gameUpdated(gameID: String!, userID: String!): Game!
  # Stream per-user boardstate updates. Clients should provide a unique obsID
  # (e.g., userID+tabId) so reconnects replace old observers cleanly.
  boardstateUpdated(obsID: String!, userID: String!): BoardState!
}

type Card {
  FaceName: String
  Name: String!
  ID: String!
  Quantity: Int
  Tapped: Boolean
  Flipped: Boolean
  Counters: [Counter]
  Colors: String
  ColorIdentity: String
  FaceManaValue: String
  FaceConvertedManaCost: String
  CMC: String
  ManaCost: String
  UUID: String
  Power: String
  Toughness: String
  Types: String
  Subtypes: String
  Supertypes: String
  Text: String
  TCGID: String
  ScryfallID: String
  ScreenX: Float
  ScreenY: Float
  CurrentZone: String
  SetCode: String
  CollectorNumber: String
  Category: String
  SourceFormat: String
}

# --- Deck import / product-event contract (Phase 1, plan 01-01) ---
# previewDeck and trackProductEvent are deliberately Mutation fields, not
# Query fields, per the locked api-contract in .planning/intel/constraints.md:
# previewDeck writes a product_events row and moves Prometheus collectors, and
# trackProductEvent is inherently a write. Neither belongs under type Query.

type DeckPreview {
  SourceType: String!
  CardCount: Int!
  Entries: [DeckPreviewEntry!]!
  CommanderCandidates: [Card!]!
  Unresolved: [DeckImportIssue!]!
  Warnings: [String!]!
  CanContinue: Boolean!
  BlockingErrors: [String!]!
}

type DeckPreviewEntry {
  Quantity: Int!
  Name: String!
  SetCode: String
  CollectorNumber: String
  Category: String
  Section: String!
  SourceLine: Int!
  Resolved: Boolean!
  Card: Card
}

type DeckImportIssue {
  SourceLine: Int!
  RawLine: String!
  Name: String!
  Reason: String!
  Candidates: [DeckSuggestion!]!
}

type DeckSuggestion {
  Name: String!
  Score: Float!
  LowConfidence: Boolean!
}

type User {
  ID: String!
  Username: String!
  Password: String
  Token: String
  Boardstate: BoardState
  # DisplayName is the visitor-typed, non-unique label (D-2.7/D-2.8). Every
  # render site resolves display names through `DisplayName ?? Username`.
  DisplayName: String
  # IsGuest marks a guest identity created through guestSession (D-2.1).
  IsGuest: Boolean
  # GuestCredential is the high-entropy guest re-auth secret (DEC-D). It is
  # returned only by the guest-session mutations and is never persisted in
  # plaintext -- only its hash is stored server-side.
  GuestCredential: String
}

type Game {
  ID: String!
  CreatedAt: Time!
  Rules: [Rule!]
  Turn: Turn
  Players: [User]
  Stack: [Card]
  Status: GameStatus!
  Result: GameResult
  WinnerIDs: [String!]
  WinCondition: String
  PendingWinClaim: PendingWinClaim
}

type Turn {
  Player: String!
  Phase: String!
  Number: Int!
  Priority: String!
}

type PendingWinClaim {
  ClaimedBy: String!
  Condition: String
  Remaining: [String!]!
}

type GameLogEvent {
  ID: ID!
  GameID: String!
  EventTime: Time!
  Type: String!
  Actor: String
  Payload: String
}

enum GameStatus {
  IN_PROGRESS
  FINISHED
}

enum GameResult {
  WIN
  DRAW
}

type Rule {
  Name: String!
  Value: String!
}

type GameFormat {
  ID: String!
  Name: String!
  StartingLife: Int!
  DefaultDeckSize: Int!
  CommanderEnabled: Boolean!
  PhaseSequence: [String!]!
  Zones: [GameFormatZone!]!
}

type GameFormatZone {
  ID: String!
  Label: String!
  Visibility: String!
  Kind: String!
  SupportsCards: Boolean!
}

type Counter {
  Name: String!
  Value: String!
}

type BoardState {
  UserID: String!
  User: String!
  Life: Int! 
  GameID: String!
  Commander: [Card!]!
  Library: [Card!]!
  Graveyard: [Card!]!
  Exiled: [Card!]!
  Battlefield: [Card!]!
  Hand: [Card!]!
  Revealed: [Card!]!
  Controlled: [Card!]!
  Counters: [Counter!]
}

